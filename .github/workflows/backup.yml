name: Scheduled Cloud Backup

# ==============================================================================
# ⚠️ IMPORTANT SECURITY WARNING:
# GitHub-hosted Actions runners operate on dynamic public IP pools.
# For this workflow to connect to MongoDB Atlas, your Atlas Network Access
# list would require allowlisting 0.0.0.0/0 (all IPs), which significantly
# broadens your attack surface compared to local MacBook IP access.
#
# FOR MAXIMUM SECURITY:
# - SetupMint recommends the primary macOS LaunchAgent scheduler (npm run backup:schedule:install)
# - This GitHub Actions workflow is provided for manual emergency triggering (workflow_dispatch)
#   or dedicated self-hosted runners with static IPs.
# - Scheduled cron is COMMENTED OUT by default to prevent unexpected runs.
# ==============================================================================

on:
  workflow_dispatch: # Manual trigger only by default
  # schedule:
  #   - cron: '30 21 * * *' # 02:30 AM IST (UTC 21:30)

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Unattended Scheduled Backup
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          S3_ENDPOINT: ${{ secrets.S3_ENDPOINT }}
          S3_BUCKET: ${{ secrets.S3_BUCKET }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
          S3_REGION: ${{ secrets.S3_REGION || 'auto' }}
          BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT || secrets.S3_ENDPOINT }}
          BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
          BACKUP_S3_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID || secrets.S3_ACCESS_KEY_ID }}
          BACKUP_S3_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY || secrets.S3_SECRET_ACCESS_KEY }}
          BACKUP_S3_PREFIX: ${{ secrets.BACKUP_S3_PREFIX || 'setupmint-backups' }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
          BACKUP_RETAIN_DAILY: 30
          BACKUP_RETAIN_MONTHLY: 12
          BACKUP_ALERT_TELEGRAM_BOT_TOKEN: ${{ secrets.BACKUP_ALERT_TELEGRAM_BOT_TOKEN }}
          BACKUP_ALERT_TELEGRAM_CHAT_ID: ${{ secrets.BACKUP_ALERT_TELEGRAM_CHAT_ID }}
        run: node scripts/backup-scheduled.js
