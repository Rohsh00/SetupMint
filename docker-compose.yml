version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: tradevault-mongodb
    restart: unless-stopped
    ports:
      - "127.0.0.1:27017:27017"
    environment:
      MONGO_INITDB_DATABASE: tradevault
    volumes:
      - mongo_data:/data/db
    networks:
      - tradevault-net

networks:
  tradevault-net:
    driver: bridge

volumes:
  mongo_data:
    driver: local
